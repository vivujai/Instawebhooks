name: IRHS Monitor

on:
  schedule:
    # UTC times — 13:00 UTC = 9:00 AM EDT, 14:00 UTC = 9:00 AM EST
    - cron: "0 13 * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run monitor
        env:
          ZAP_HOOK: ${{ secrets.ZAP_HOOK }}
        run: node monitor.js
